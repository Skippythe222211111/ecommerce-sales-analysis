name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  postgres:
    name: PostgreSQL load and SQL/Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt psycopg2-binary

      - name: Download UCI data and build the PostgreSQL CSV
        run: python scripts/run_analysis.py --download

      - name: Check the generated CSV
        run: test -s data/online_retail_for_postgres.csv

      - name: Create schema
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres -f sql/00_schema.sql

      - name: Load raw rows with \copy
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres -c "\copy retail.online_retail_raw(invoice_no, stock_code, description, quantity, invoice_date, unit_price, customer_id, country) FROM 'data/online_retail_for_postgres.csv' WITH (FORMAT csv, HEADER true, NULL '')"

      - name: Run analysis queries
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres -f sql/01_analysis.sql

      - name: Run SQL validation
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres -f sql/02_validation.sql

      - name: Compare SQL with the published Python results
        run: python scripts/verify_sql_parity.py --dsn "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
